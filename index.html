<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Il Tutor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="container py-4" id="app">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 mb-0">Il Tutor</h1>
      <div class="d-flex align-items-center gap-2">
        <label for="tier-select" class="small text-muted mb-0">Vocabulary</label>
        <select id="tier-select" class="form-select form-select-sm w-auto">
          <option value="1">Essential</option>
          <option value="2">Common</option>
          <option value="3" selected>Full</option>
        </select>
      </div>
    </div>

    <!-- Exercise card -->
    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <p class="text-muted small mb-1">Translate to Italian</p>
        <p id="prompt" class="fs-4 mb-0 prompt-text">&nbsp;</p>
      </div>
    </div>

    <!-- Input row -->
    <div class="input-group mb-2">
      <input
        id="answer-input"
        type="text"
        class="form-control form-control-lg"
        placeholder="Italian translation…"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="none"
        spellcheck="false"
      >
      <button id="check-btn" class="btn btn-primary px-4">Check</button>
    </div>

    <!-- Accent buttons -->
    <div class="d-flex gap-1 mb-3 flex-wrap" id="accent-row">
      <button class="btn btn-outline-secondary btn-sm accent-btn" data-char="à">à</button>
      <button class="btn btn-outline-secondary btn-sm accent-btn" data-char="è">è</button>
      <button class="btn btn-outline-secondary btn-sm accent-btn" data-char="é">é</button>
      <button class="btn btn-outline-secondary btn-sm accent-btn" data-char="ì">ì</button>
      <button class="btn btn-outline-secondary btn-sm accent-btn" data-char="ò">ò</button>
      <button class="btn btn-outline-secondary btn-sm accent-btn" data-char="ù">ù</button>
    </div>

    <!-- Hint panel -->
    <div id="hint-panel" class="d-none mb-3">
      <div class="card card-body py-2 hint-panel">
        <div id="hint-content"></div>
      </div>
    </div>

    <!-- Feedback -->
    <div id="feedback" class="mb-3"></div>

    <!-- Secondary actions -->
    <div class="d-flex gap-2 align-items-center">
      <button id="explain-btn" class="btn btn-outline-secondary btn-sm">Rules</button>
      <button id="hint-btn"    class="btn btn-outline-warning   btn-sm">Hint</button>
      <button id="skip-btn"    class="btn btn-link btn-sm text-muted">Skip</button>
      <span id="streak-badge" class="ms-auto small text-muted streak-text"></span>
    </div>

    <!-- Explainer panel -->
    <div id="explainer" class="card mt-3 d-none border-secondary">
      <div class="card-header small text-muted">Grammar note</div>
      <div class="card-body" id="explainer-content"></div>
    </div>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
